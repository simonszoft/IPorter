<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ program_name }} v{{ version }} - Change Password</title>
  <link rel="icon" href="{{ url_for('asset_file', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='iporter.css') }}">
</head>
<body>
  {% include '_header.html' %}
  <div class="wrap" style="max-width: 560px;">
    <div class="card">
      <div class="head">
        <div>
          <h1>Change Password</h1>
          <div class="meta">Update Web UI login password stored in secure.json.</div>
        </div>
        <div class="inline">
          <a class="ghost" href="{{ url_for('status_page') }}">Back to Status</a>
          <a class="ghost danger" href="{{ url_for('logout') }}">Logout</a>
        </div>
      </div>
      <div class="content">
        {% if message %}
          <div class="banner {{ message_kind }}">{{ message }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('change_password') }}">
          <div class="grid">
            <input name="current_password" type="password" autocomplete="current-password" placeholder="Current password" required>
            <input name="new_password" type="password" autocomplete="new-password" placeholder="New password" required>
            <input name="confirm_password" type="password" autocomplete="new-password" placeholder="Confirm new password" required>
          </div>
          <div class="actions">
            <button type="submit">Change Password</button>
          </div>
        </form>
      </div>
    </div>
    {% include '_footer.html' %}
  </div>
</body>
</html>
